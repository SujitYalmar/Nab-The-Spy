[versions]
agp = "8.3.2"                 # stable with SDK 35
kotlin = "2.0.21"

# 🔴 FIX HERE (DOWNGRADED)
coreKtx = "1.13.1"             # ✅ LAST version that supports compileSdk 35

junit = "4.13.2"
